allowBuilds:
  sharp: true
# Force a single sharp/libvips across the tree. favicons wants ^0.33 and
# vite-imagetools wants ^0.35; without this both get installed and their
# native libvips builds collide in one process (VipsInterpretation enum
# corruption -> favicon generation fails with NO_FILES_FOUND).
overrides:
  sharp: ^0.35.2
minimumReleaseAgeExclude:
  - eslint-plugin-unicorn@69.0.0
  - '@babel/core@7.29.1'
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18
